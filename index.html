<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>よむたんけん｜1・2年生の読解</title>
<link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-effects-library.css" />
<style>
  :root{
    --primary:#2e8b74; --primary-dark:#22725f; --accent:#f5a623; --ink:#2b3a36;
    --bg:#fdf8ee; --card:#ffffff; --soft:#e8f4ef; --danger:#d96a57; --line:#dce8e2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);}
  header.app-head{display:flex;align-items:center;gap:14px;padding:12px 20px;background:#fff;border-bottom:3px solid var(--soft);position:sticky;top:0;z-index:20;}
  .app-title{font-size:26px;font-weight:900;color:var(--primary-dark);letter-spacing:.04em;}
  .app-sub{font-size:14px;color:#6b7f78;font-weight:700;}
  .head-spacer{flex:1;}
  .toggle-btn{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;font-family:inherit;}
  .toggle-btn.on{background:var(--soft);border-color:var(--primary);color:var(--primary-dark);}
  main{max-width:1180px;margin:0 auto;padding:14px 20px 16px;}
  .screen{display:none;}
  .screen.active{display:block;}
  /* home */
  .hero{display:flex;gap:20px;background:var(--card);border-radius:22px;padding:12px 22px;box-shadow:0 4px 18px rgba(46,139,116,.10);align-items:center;}
  .hero-text{flex:1;}
  .hero-text h1{margin:0 0 6px;font-size:26px;color:var(--primary-dark);}
  .hero-text p{margin:0;font-size:15.5px;line-height:1.55;color:#47635a;}
  .hero img{width:182px;max-width:42%;border-radius:16px;display:block;}
  .grade-tabs{display:flex;gap:12px;margin:12px 0 10px;}
  .grade-tab{flex:1;border:3px solid var(--line);background:#fff;border-radius:16px;padding:10px;font-size:22px;font-weight:900;cursor:pointer;font-family:inherit;color:var(--ink);}
  .grade-tab.on{border-color:var(--primary);background:var(--soft);color:var(--primary-dark);}
  .text-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .text-card{background:var(--card);border-radius:18px;padding:10px 14px;box-shadow:0 3px 12px rgba(46,139,116,.08);border:2px solid transparent;text-align:left;cursor:pointer;font-family:inherit;width:100%;}
  .text-card:hover{border-color:var(--primary);}
  .kind-badge{display:inline-block;font-size:13px;font-weight:900;padding:2px 10px;border-radius:999px;background:#fdeed3;color:#9a6a12;margin-bottom:5px;}
  .kind-badge.setsu{background:#e2ecfb;color:#33598c;}
  .text-card h3{margin:0 0 4px;font-size:19px;color:var(--ink);}
  .text-card .meta{font-size:14px;color:#6b7f78;font-weight:700;}
  .text-card .stars{font-size:15px;color:var(--accent);margin-top:2px;min-height:18px;}
  .home-actions{display:flex;gap:14px;margin-top:12px;}
  .action-card{flex:1;background:var(--card);border-radius:18px;padding:12px 18px;box-shadow:0 3px 12px rgba(46,139,116,.08);display:flex;align-items:center;gap:14px;cursor:pointer;border:2px solid transparent;font-family:inherit;text-align:left;}
  .action-card:hover{border-color:var(--primary);}
  .action-card h4{margin:0;font-size:19px;}
  .action-card p{margin:2px 0 0;font-size:14px;color:#6b7f78;font-weight:700;}
  .action-card .count{margin-left:auto;font-size:26px;font-weight:900;color:var(--primary-dark);}
  /* passage */
  .passage-card{background:var(--card);border-radius:20px;padding:22px 26px;box-shadow:0 4px 16px rgba(46,139,116,.09);}
  .passage-title{font-size:24px;font-weight:900;margin:0 0 14px;color:var(--primary-dark);}
  .passage{line-height:1.9;writing-mode:vertical-rl;}
  #screen-read .passage{height:480px;width:fit-content;max-width:100%;margin:0 auto;overflow-x:auto;}
  #screen-quiz .passage{height:556px;width:fit-content;max-width:100%;margin:0 auto;overflow-x:auto;}
  .g1 .passage{font-size:24px;}
  .g2 .passage{font-size:23px;}
  .sent{display:block;padding:6px 3px;border-radius:10px;margin-left:4px;}
  .sent rt{font-size:.5em;color:#7a8d86;}
  body.furigana-off .sent rt, body.furigana-off .q-text rt, body.furigana-off .choice-btn rt{display:none;}
  .sent.tap{cursor:pointer;border:2px dashed transparent;}
  .sent.tap:hover{border-color:var(--primary);background:var(--soft);}
  .sent.picked-wrong{background:#fbe9e4;border-color:var(--danger);}
  .sent.picked-right{background:#e5f6ec;border-color:#39a96b;}
  .sent.evidence-show{background:#fff6d9;border-color:var(--accent);}
  .big-btn{display:inline-block;border:none;background:var(--primary);color:#fff;font-size:21px;font-weight:900;padding:15px 34px;border-radius:999px;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 var(--primary-dark);}
  .big-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--primary-dark);}
  .big-btn.sub{background:#fff;color:var(--primary-dark);border:2px solid var(--primary);box-shadow:none;}
  .center{text-align:center;}
  .row-gap{margin-top:18px;}
  /* quiz */
  .quiz-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
  #screen-quiz .passage-card{padding:16px 20px;}
  #screen-quiz .passage{line-height:1.8;}
  #screen-quiz .sent{margin-bottom:2px;}
  .quiz-side{display:flex;flex-direction:column;gap:12px;}
  .navi-bar{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:10px 16px;box-shadow:0 3px 10px rgba(46,139,116,.08);}
  .navi-bar img{width:58px;height:58px;border-radius:50%;object-fit:cover;background:var(--soft);}
  .navi-msg{font-size:17px;font-weight:800;line-height:1.5;}
  .q-card{background:var(--card);border-radius:20px;padding:20px 22px;box-shadow:0 4px 16px rgba(46,139,116,.09);}
  .q-count{font-size:14px;font-weight:900;color:#8aa39a;margin-bottom:6px;}
  .q-text{font-size:23px;font-weight:900;line-height:1.6;margin:0 0 16px;}
  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice-btn{border:3px solid var(--line);background:#fff;border-radius:14px;padding:14px 18px;font-size:20px;font-weight:800;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);min-height:60px;}
  .choice-btn:hover{border-color:var(--primary);}
  .choice-btn.wrong{background:#fbe9e4;border-color:var(--danger);opacity:.55;}
  .choice-btn.right{background:#e5f6ec;border-color:#39a96b;}
  .explain-box{background:#fff6d9;border:2px solid var(--accent);border-radius:14px;padding:14px 18px;font-size:17px;line-height:1.7;font-weight:700;display:none;}
  .explain-box.show{display:block;}
  .explain-box .ev{color:#9a6a12;font-weight:900;}
  .phase-note{font-size:17px;font-weight:900;color:var(--primary-dark);background:var(--soft);border-radius:12px;padding:12px 16px;display:none;}
  .phase-note.show{display:block;}
  /* result / records */
  .result-card{background:var(--card);border-radius:22px;padding:28px;box-shadow:0 4px 18px rgba(46,139,116,.10);text-align:center;}
  .result-stars{font-size:52px;color:var(--accent);letter-spacing:.1em;}
  .result-card h2{margin:8px 0;font-size:28px;color:var(--primary-dark);}
  .result-card p{font-size:18px;font-weight:700;line-height:1.7;}
  .result-face{width:110px;height:110px;border-radius:50%;object-fit:cover;background:var(--soft);}
  .rec-table{width:100%;border-collapse:collapse;font-size:17px;font-weight:700;}
  .rec-table td,.rec-table th{border-bottom:2px solid var(--soft);padding:10px 8px;text-align:left;}
  .back-link{background:none;border:none;color:var(--primary-dark);font-size:17px;font-weight:900;cursor:pointer;font-family:inherit;padding:6px 0;}
  .passage-card{position:relative;}
  #tap-hand{position:absolute;top:50%;left:50%;font-size:110px;display:none;z-index:6;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));}
  #tap-hand.show{display:block;animation:handPrompt 2.2s ease forwards;}
  @keyframes handPrompt{0%{opacity:0;transform:translate(-50%,-40%) rotate(-8deg);}18%{opacity:1;transform:translate(-50%,-58%) rotate(-8deg);}38%{transform:translate(-50%,-42%) rotate(-8deg);}58%{transform:translate(-50%,-58%) rotate(-8deg);}78%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg);}100%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg);}}
  .sent.tap{animation:sentPulse .7s ease-in-out 3;}
  .sent.hint-glow{background:#fff3c4 !important;box-shadow:inset 0 0 0 3px #f0cf6e;}
  .order-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:8px 0 6px;}
  .order-card{writing-mode:vertical-rl;height:400px;width:196px;padding:16px 12px;font-size:21px;line-height:1.9;font-family:inherit;font-weight:700;color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:16px;cursor:pointer;position:relative;text-align:start;box-shadow:0 3px 10px rgba(46,139,116,.08);}
  .g1 .order-card{font-size:23px;}
  .order-card.done{border-color:var(--primary);background:#eefaf4;cursor:default;}
  .order-num{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;writing-mode:horizontal-tb;}
  .order-card.shake{animation:ordShake .3s;}
  .sort-cards{display:flex;flex-direction:column;gap:10px;}
  .sort-card{position:relative;border:3px solid var(--line);background:#fff;border-radius:14px;padding:14px 52px 14px 18px;font-size:19px;font-weight:800;font-family:inherit;color:var(--ink);cursor:pointer;text-align:left;min-height:58px;}
  .sort-card.done{border-color:var(--primary);background:#eefaf4;cursor:default;}
  .sort-card.shake{animation:ordShake .3s;}
  .sort-num{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;}
  #screen-home .text-grid{max-height:312px;overflow-y:auto;padding:2px;-webkit-overflow-scrolling:touch;}
  @keyframes ordShake{25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  @keyframes sentPulse{0%,100%{background:#ffffff;}50%{background:#e9f7f0;}}
  @media (max-width: 900px) {
    .text-grid{grid-template-columns:1fr;}
    .quiz-grid{grid-template-columns:1fr;}
    .hero{flex-direction:column;}
    .hero img{max-width:100%;width:100%;}
  }

  /* ===== 読解画面：本文は右、問いは左。縦書きで一画面に ===== */
  body.quiz-mode{overflow:hidden;height:100dvh;}
  body.quiz-mode header.app-head{display:none;}
  body.quiz-mode main{width:100%;max-width:none;height:100dvh;margin:0;padding:8px 12px;}
  body.quiz-mode #screen-quiz{height:100%;min-height:0;}
  body.quiz-mode #screen-quiz>.back-link{display:none;}

  body.quiz-mode .quiz-grid{
    height:100%;min-height:0;
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    grid-template-areas:"side passage";
    gap:clamp(8px,1.2vw,16px);
    align-items:stretch;
  }
  body.quiz-mode #screen-quiz .passage-card{
    grid-area:passage;min-width:0;min-height:0;height:100%;
    padding:12px 14px;display:flex;flex-direction:column;overflow:hidden;
  }
  body.quiz-mode #screen-quiz .passage-title{
    flex:none;font-size:20px;margin:0 0 7px;
  }
  body.quiz-mode #screen-quiz .passage{
    flex:1;min-width:0;min-height:0;
    width:100%;max-width:none;height:auto;margin:0;
    line-height:1.65;overflow:auto;overscroll-behavior:contain;
  }
  body.quiz-mode #screen-quiz .sent{padding:4px 2px;margin-left:2px;}

  body.quiz-mode .quiz-side{
    grid-area:side;min-width:0;min-height:0;height:100%;
    display:flex;flex-direction:column;gap:8px;overflow:hidden;
  }
  body.quiz-mode .navi-bar{
    flex:none;min-height:58px;padding:6px 10px;gap:8px;
  }
  body.quiz-mode .navi-bar img{width:44px;height:44px;flex:none;}
  body.quiz-mode .navi-msg{font-size:15px;line-height:1.35;}

  /* 問いは右側に縦書き、選択肢は左側に縦書きで並べる */
  body.quiz-mode .q-card{
    flex:1;min-width:0;min-height:0;
    padding:12px;overflow:hidden;
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(88px,.42fr);
    grid-template-rows:auto minmax(0,1fr) auto auto auto;
    grid-template-areas:
      "count count"
      "choices question"
      "note note"
      "explain explain"
      "next next";
    gap:8px;
  }
  body.quiz-mode .q-count{grid-area:count;margin:0;font-size:13px;}
  body.quiz-mode .q-text{
    grid-area:question;min-width:0;min-height:0;
    writing-mode:vertical-rl;text-orientation:mixed;
    font-size:clamp(18px,1.8vw,22px);line-height:1.5;
    margin:0;padding:8px;background:#fff;border-radius:12px;
    overflow:auto;overscroll-behavior:contain;
  }
  body.quiz-mode .choices{
    grid-area:choices;min-width:0;min-height:0;
    display:flex;flex-direction:row-reverse;align-items:stretch;
    justify-content:space-between;gap:7px;overflow:hidden;
  }
  body.quiz-mode .choice-btn{
    flex:1 1 0;min-width:0;min-height:0;width:auto;height:100%;
    max-width:150px;padding:9px 7px;border-width:2px;
    writing-mode:vertical-rl;text-orientation:mixed;
    text-align:start;font-size:clamp(16px,1.55vw,19px);
    line-height:1.45;overflow:auto;overscroll-behavior:contain;
  }
  body.quiz-mode #sort-area{grid-area:choices;min-width:0;min-height:0;overflow:auto;}
  body.quiz-mode .phase-note{
    grid-area:note;min-width:0;margin:0;
    font-size:13px;line-height:1.4;padding:7px 9px;
  }
  body.quiz-mode .explain-box{
    grid-area:explain;min-width:0;min-height:0;
    margin:0;padding:8px 10px;font-size:14px;line-height:1.45;
    max-height:min(22vh,150px);overflow:auto;overscroll-behavior:contain;
  }
  body.quiz-mode .q-card>.center{grid-area:next;margin:0;}
  body.quiz-mode .row-gap{margin-top:0;}
  body.quiz-mode .big-btn{font-size:17px;padding:9px 22px;}

  /* 小さな画面では読みやすさを優先して縦並びに切り替える */
  @media(max-width:680px){
    body.quiz-mode{height:auto;min-height:100dvh;overflow:auto;}
    body.quiz-mode main{height:auto;min-height:100dvh;padding:6px 8px;}
    body.quiz-mode .quiz-grid{
      height:auto;min-height:calc(100dvh - 12px);
      grid-template-columns:minmax(0,1fr);
      grid-template-rows:minmax(260px,42dvh) minmax(440px,1fr);
      grid-template-areas:"passage" "side";
    }
    body.quiz-mode #screen-quiz .passage-card{padding:8px 10px;}
    body.quiz-mode #screen-quiz .passage-title{font-size:17px;margin-bottom:3px;}
    body.quiz-mode .quiz-side{min-height:440px;}
    body.quiz-mode .navi-bar{min-height:44px;padding:4px 8px;}
    body.quiz-mode .navi-bar img{width:34px;height:34px;}
    body.quiz-mode .navi-msg{font-size:13px;}
    body.quiz-mode .q-card{padding:9px;gap:6px;}
    body.quiz-mode .q-text{font-size:18px;}
    body.quiz-mode .choice-btn{font-size:16px;padding:7px 5px;}
    body.quiz-mode .explain-box{font-size:13px;max-height:120px;}
  }
  @media(max-height:650px) and (min-width:681px){
    body.quiz-mode main{padding:5px 8px;}
    body.quiz-mode .navi-bar{min-height:44px;padding:3px 8px;}
    body.quiz-mode .navi-bar img{width:34px;height:34px;}
    body.quiz-mode .navi-msg{font-size:13px;}
    body.quiz-mode .q-card{padding:8px;gap:5px;}
    body.quiz-mode .q-text{font-size:17px;padding:5px;}
    body.quiz-mode .choice-btn{font-size:15px;padding:6px 4px;}
    body.quiz-mode .explain-box{font-size:12px;max-height:105px;padding:6px 8px;}
    body.quiz-mode .phase-note{font-size:12px;padding:5px 7px;}
  }

</style>
</head>
<body>
<header class="app-head">
  <div>
    <div class="app-title">よむたんけん</div>
    <div class="app-sub">1・2年生　国語　読むこと</div>
  </div>
  <div class="head-spacer"></div>
  <button class="toggle-btn" id="btn-furigana">ふりがな：ON</button>
  <button class="toggle-btn" id="btn-sound">音：ON</button>
</header>
<main>
  <!-- ホーム -->
  <section class="screen active" id="screen-home">
    <div class="hero">
      <div class="hero-text">
        <h1>文を よんで、答えの文を さがそう</h1>
        <p>お話や 説明の文を読んで、もんだいに答えます。答えたら、答えが どこに書いてあるか、その文を 本文からタップで探します。答えと文の両方が合えば、読めた証拠です。</p>
      </div>
      <img src="https://tt-sensei.github.io/navi-character-/assets/groups/daily/pair-daily-reading-saku-tsuki.png" alt="本を読む さくと つき" />
    </div>
    <div class="grade-tabs">
      <button class="grade-tab on" data-grade="1">1年生</button>
      <button class="grade-tab" data-grade="2">2年生</button>
    </div>
    <div class="text-grid" id="text-grid"></div>
    <div class="home-actions">
      <button class="action-card" id="btn-train">
        <div><h4>とっくん（まちがい直し）</h4><p>まちがえた もんだいを、もう一度たしかめます</p></div>
        <div class="count" id="train-count">0</div>
      </button>
      <button class="action-card" id="btn-records">
        <div><h4>学習の記録</h4><p>読んだ文と、自力でできた もんだい</p></div>
        <div class="count">→</div>
      </button>
    </div>
  </section>

  <!-- 読む -->
  <section class="screen" id="screen-read">
    <button class="back-link" id="btn-read-back">← もどる</button>
    <div class="passage-card">
      <h2 class="passage-title" id="read-title"></h2>
      <div class="passage" id="read-passage"></div>
    </div>
    <div class="center row-gap">
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;"><button class="big-btn" id="btn-to-quiz">もんだいへ すすむ</button><button class="big-btn sub" id="btn-order">じゅんばんに ならべよう</button></div>
    </div>
  </section>

  <!-- もんだい -->
  <section class="screen" id="screen-quiz">
    <button class="back-link" id="btn-quiz-back">← やめる</button>
    <div class="quiz-grid">
      <div class="passage-card">
        <h2 class="passage-title" id="quiz-title"></h2>
        <div id="tap-hand">👆</div>
        <div class="passage" id="quiz-passage"></div>
      </div>
      <div class="quiz-side">
        <div class="navi-bar">
          <img id="navi-face" src="https://tt-sensei.github.io/navi-character-/assets/web/characters/saku/expressions/01-normal-smile.webp" alt="さく" />
          <div class="navi-msg" id="navi-msg">文を よく読んで、答えを えらんでね。</div>
        </div>
        <div class="q-card">
          <div class="q-count" id="q-count"></div>
          <p class="q-text" id="q-text"></p>
          <div class="phase-note" id="phase-note">答えは、どこに 書いてあるかな？　その文を タップしてね。</div>
          <div class="choices" id="choices"></div>
          <div id="sort-area" style="display:none;"><div class="sort-cards" id="sort-cards"></div></div>
          <div class="explain-box row-gap" id="explain-box"></div>
          <div class="center row-gap">
            <button class="big-btn" id="btn-next" style="display:none;">つぎへ</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- じゅんばん ならべ -->
  <section class="screen" id="screen-order">
    <button class="back-btn" id="btn-order-back">← やめる</button>
    <div class="passage-card">
      <h2 class="passage-title" id="order-title"></h2>
      <div class="navi-bar" style="box-shadow:none;padding:0 0 6px;">
        <img id="order-face" src="https://tt-sensei.github.io/navi-character-/assets/web/characters/saku/expressions/01-normal-smile.webp" alt="さく">
        <div class="navi-msg" id="order-msg">物語の はじめから、順番に 文を タップしてね。</div>
      </div>
      <div class="order-row" id="order-cards"></div>
    </div>
  </section>

  <!-- 結果 -->
  <section class="screen" id="screen-result">
    <div class="result-card">
      <img class="result-face" id="result-face" src="https://tt-sensei.github.io/navi-character-/assets/web/characters/saku/expressions/08-celebrating.webp" alt="さく" />
      <div class="result-stars" id="result-stars">★★★★</div>
      <h2 id="result-title">おつかれさま！</h2>
      <p id="result-msg"></p>
      <div class="row-gap">
        <button class="big-btn" id="btn-result-home">文の いちらんへ もどる</button>
      </div>
    </div>
  </section>

  <!-- 記録 -->
  <section class="screen" id="screen-records">
    <button class="back-link" id="btn-records-back">← もどる</button>
    <div class="passage-card">
      <h2 class="passage-title">学習の記録</h2>
      <div id="records-body"></div>
    </div>
  </section>
</main>
<script src="https://tt-sensei.github.io/edu-effects/js/edu-effects.js"></script>
<script>
"use strict";
/* ================= 文章データ =================
   文章と問題は texts.json に分離しています（他のAIにも作ってもらえるように）。
   形式と作り方は README.md の「文章データの作り方」を見てください。 */
let TEXTS = [];

/* ================= 状態 ================= */
const KEY = { mistakes: "yomuTanken.mistakes.v1", stats: "yomuTanken.stats.v1", settings: "yomuTanken.settings.v1" };
function loadJSON(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } }
function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 保存できなくても学習は続ける */ } }
let mistakes = loadJSON(KEY.mistakes, []);            // [{textId, qq}] qq=問題の文そのもの（並べ替えに強い）
function qKey(textId, qObj) { return textId + "|" + plain(qObj.q); }
function migrateMistakes() {
  const out = [];
  for (const m of mistakes) {
    if (!m) continue;
    const t = TEXTS.find(x => x.id === m.textId);
    if (!t) continue;
    if (typeof m.qq === "string" && (m.qq === "__order__" ? !!t.order : t.questions.some(q => plain(q.q) === m.qq))) out.push({ textId: m.textId, qq: m.qq });
    else if (typeof m.q === "number" && t.questions[m.q]) out.push({ textId: m.textId, qq: plain(t.questions[m.q].q) });
  }
  if (JSON.stringify(out) !== JSON.stringify(mistakes)) { mistakes = out; saveJSON(KEY.mistakes, mistakes); }
}
let stats = loadJSON(KEY.stats, { texts: {}, totalSelf: 0, totalDone: 0 });
let settings = Object.assign({ sound: true, furigana: true }, loadJSON(KEY.settings, {}));
let currentGrade = 1;

/* ================= 音（sounds-recipe-。読み込めなくても学習は続ける） ================= */
let soundMod = null, audioCtx = null;
import("https://tt-sensei.github.io/sounds-recipe-/sounds.js").then(m => { soundMod = m; }).catch(() => {});
function play(id) {
  if (!settings.sound || !soundMod) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    soundMod.playSound(audioCtx, id, 0.5);
  } catch (e) {}
}
function confetti(el) { try { if (window.EduEffects && el) EduEffects.confetti(el, 26); } catch (e) {} }

/* ================= ふりがな ================= */
function R(s) {
  return String(s).replace(/([一-龯々]+)《([^》]+)》/g, (m, k, y) => settings.furigana ? `<ruby>${k}<rt>${y}</rt></ruby>` : k);
}
function plain(s) { return String(s).replace(/([一-龯々]+)《[^》]+》/g, "$1"); }

/* ================= 画面 ================= */
const $ = id => document.getElementById(id);
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
  document.body.classList.toggle("quiz-mode", id === "screen-quiz");
  window.scrollTo(0, 0);
}
const FACE = {
  normal: "https://tt-sensei.github.io/navi-character-/assets/web/characters/saku/expressions/01-normal-smile.webp",
  happy: "https://tt-sensei.github.io/navi-character-/assets/web/characters/saku/expressions/02-happy.webp",
  think: "https://tt-sensei.github.io/navi-character-/assets/web/characters/saku/expressions/03-thinking.webp",
  celeb: "https://tt-sensei.github.io/navi-character-/assets/web/characters/saku/expressions/08-celebrating.webp"
};
function setNavi(face, msg) { $("navi-face").src = face; $("navi-msg").textContent = msg; }

/* ================= ホーム ================= */
function renderHome() {
  const grid = $("text-grid");
  grid.innerHTML = "";
  TEXTS.filter(t => t.grade === currentGrade).forEach(t => {
    const st = stats.texts[t.id] || { best: 0, done: false };
    const btn = document.createElement("button");
    btn.className = "text-card";
    btn.innerHTML = `<span class="kind-badge ${t.kind === "せつめい" ? "setsu" : ""}">${t.kind}</span>
      <h3>${R(t.title)}</h3>
      <div class="meta">もんだいは 4つ</div>
      <div class="stars">${st.done ? "★".repeat(st.best) + "☆".repeat(4 - st.best) : ""}</div>`;
    btn.addEventListener("click", () => { play("decide"); openRead(t.id); });
    grid.appendChild(btn);
  });
  $("train-count").textContent = mistakes.length;
  document.body.classList.toggle("g1", currentGrade === 1);
  document.body.classList.toggle("g2", currentGrade === 2);
}
document.querySelectorAll(".grade-tab").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".grade-tab").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  currentGrade = Number(b.dataset.grade);
  play("click");
  renderHome();
}));

/* ================= 読む ================= */
let currentText = null;
function passageHTML(t, tappable) {
  return t.sentences.map((s, i) => `<span class="sent ${tappable ? "tap" : ""}" data-idx="${i}">${R(s)}</span>`).join("");
}
function openRead(textId) {
  currentText = TEXTS.find(t => t.id === textId);
  $("read-title").innerHTML = R(currentText.title);
  $("btn-order").style.display = currentText.order ? "inline-block" : "none";
  $("read-passage").innerHTML = passageHTML(currentText, false);
  $("screen-read").className = "screen active " + (currentText.grade === 1 ? "g1" : "g2");
  show("screen-read");
}
$("btn-read-back").addEventListener("click", () => { play("click"); renderHome(); show("screen-home"); });
$("btn-order").addEventListener("click", () => { play("start"); startOrder(currentText.id, "text"); });
$("btn-to-quiz").addEventListener("click", () => {
  play("start");
  startSession({ mode: "text", textId: currentText.id, queue: shuffle(currentText.questions.map((_, i) => i)).slice(0, 4) });
});

/* ================= もんだい ================= */
let session = null;
function startSession(cfg) {
  session = Object.assign({ pos: 0, selfCorrect: 0, stumbled: false, phase: "answer" }, cfg);
  $("quiz-title").innerHTML = R(TEXTS.find(t => t.id === session.textId).title);
  show("screen-quiz");
  renderQuestion();
}
function curQ() {
  const t = TEXTS.find(x => x.id === session.textId);
  return { t, q: t.questions[session.queue[session.pos]] };
}
function shuffle(a) { const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; }

function renderQuestion() {
  const { t, q } = curQ();
  session.stumbled = false; session.phase = "answer"; session.evMisses = 0;
  $("tap-hand").classList.remove("show");
  $("quiz-passage").innerHTML = passageHTML(t, false);
  $("screen-quiz").className = "screen active " + (t.grade === 1 ? "g1" : "g2");
  $("q-count").textContent = `もんだい ${session.pos + 1} / ${session.queue.length}`;
  $("q-text").innerHTML = R(q.q);
  $("phase-note").classList.remove("show");
  $("explain-box").classList.remove("show");
  $("btn-next").style.display = "none";
  setNavi(FACE.normal, "文を よく読んで、答えを えらんでね。");
  const box = $("choices");
  box.innerHTML = "";
  if (q.format === "sort") {
    session.phase = "sort";
    session.sortPos = 0;
    box.style.display = "none";
    $("sort-area").style.display = "block";
    setNavi(FACE.normal, "カードを、はじめから 順番に タップしてね。");
    const sc = $("sort-cards");
    sc.innerHTML = "";
    shuffle(q.cards.map((_, i) => i)).forEach(ci => {
      const b = document.createElement("button");
      b.className = "sort-card";
      b.innerHTML = R(q.cards[ci]);
      b.addEventListener("click", () => tapSortCard(b, ci, q));
      sc.appendChild(b);
    });
    return;
  }
  box.style.display = "flex";
  $("sort-area").style.display = "none";
  shuffle(q.choices).forEach(c => {
    const b = document.createElement("button");
    b.className = "choice-btn";
    b.innerHTML = R(c);
    b.dataset.value = plain(c);
    b.addEventListener("click", () => pickAnswer(b, c, q));
    box.appendChild(b);
  });
}
function tapSortCard(btn, ci, q) {
  if (session.phase !== "sort" || btn.disabled) return;
  if (ci === session.sortPos) {
    play("correct");
    session.sortPos++;
    const n = document.createElement("span");
    n.className = "sort-num";
    n.textContent = session.sortPos;
    btn.appendChild(n);
    btn.classList.add("done");
    btn.disabled = true;
    if (session.sortPos === q.cards.length) finishQuestion(q);
    else setNavi(FACE.happy, "いいよ、その調子。つぎは どれかな？");
  } else {
    play("softFail");
    session.stumbled = true;
    btn.classList.add("shake");
    setTimeout(() => btn.classList.remove("shake"), 320);
    setNavi(FACE.think, "うーん、その前に 来ることが あるよ。物語の流れを 思いうかべてみよう。");
  }
}
function pickAnswer(btn, choice, q) {
  if (session.phase !== "answer") return;
  if (plain(choice) === plain(q.answer)) {
    play("correct");
    btn.classList.add("right");
    document.querySelectorAll(".choice-btn").forEach(x => { x.disabled = true; });
    session.phase = "evidence";
    $("phase-note").classList.add("show");
    $("tap-hand").classList.add("show");
    setNavi(FACE.happy, "答えは 合っているよ。つぎは、その答えが どこに書いてあるか、文をタップして さがしてね。");
    const { t } = curQ();
    $("quiz-passage").innerHTML = passageHTML(t, true);
    document.querySelectorAll("#quiz-passage .sent").forEach(el => el.addEventListener("click", () => pickEvidence(el, q)));
  } else {
    play("softFail");
    session.stumbled = true;
    btn.classList.add("wrong");
    btn.disabled = true;
    setNavi(FACE.think, "うーん、ちがうみたい。文を もう一度 読んでみよう。");
  }
}
function pickEvidence(el, q) {
  if (session.phase !== "evidence") return;
  const idx = Number(el.dataset.idx);
  if (idx === q.evidence) {
    play("correct");
    el.classList.add("picked-right");
    document.querySelectorAll("#quiz-passage .sent").forEach(x => { x.classList.remove("tap"); x.style.pointerEvents = "none"; });
    finishQuestion(q);
  } else {
    play("softFail");
    session.stumbled = true;
    session.evMisses = (session.evMisses || 0) + 1;
    el.classList.add("picked-wrong");
    el.style.pointerEvents = "none";
    if (session.evMisses >= 2) {
      document.querySelectorAll("#quiz-passage .sent").forEach(x => { if (Number(x.dataset.idx) === q.evidence) x.classList.add("hint-glow"); });
      setNavi(FACE.think, "ヒント：答えの 言葉が 入っている文が、うっすら 光っているよ。その文を タップしてね。");
    } else {
      setNavi(FACE.think, "その文では ないみたい。答えの 言葉が 入っている文を さがしてみよう。");
    }
  }
}
function finishQuestion(q) {
  $("tap-hand").classList.remove("show");
  const { t } = curQ();
  const key = qKey(session.textId, q);
  if (!session.stumbled) {
    session.selfCorrect++;
    if (session.mode === "train") {
      mistakes = mistakes.filter(m => (m.textId + "|" + m.qq) !== key);
      saveJSON(KEY.mistakes, mistakes);
    }
    setNavi(FACE.happy, "その通り！　答えも、書いてある文も 合っていたよ。");
  } else {
    if (session.mode === "text" && !mistakes.some(m => (m.textId + "|" + m.qq) === key)) {
      mistakes.push({ textId: session.textId, qq: plain(q.q) });
      saveJSON(KEY.mistakes, mistakes);
    }
    setNavi(FACE.normal, "答えは 分かったね。この もんだいは「とっくん」に 入れたよ。あとで もう一度 たしかめよう。");
  }
  const evs = Array.isArray(q.evidence) ? q.evidence : [q.evidence];
  document.querySelectorAll("#quiz-passage .sent").forEach(x => { if (evs.includes(Number(x.dataset.idx))) x.classList.add("evidence-show"); });
  const eb = $("explain-box");
  eb.innerHTML = Array.isArray(q.evidence)
    ? `<span class="ev">じゅんばんの たしかめ：</span><br>${R(q.explain)}`
    : `<span class="ev">書いてある文：</span>${R(t.sentences[q.evidence])}<br>${R(q.explain)}`;
  eb.classList.add("show");
  session.phase = "done";
  const nb = $("btn-next");
  nb.textContent = session.pos + 1 < session.queue.length ? "つぎへ" : "けっかへ";
  nb.style.display = "inline-block";
  if (!session.stumbled) confetti(nb);
}
$("btn-next").addEventListener("click", () => {
  play("decide");
  session.pos++;
  if (session.pos < session.queue.length) renderQuestion();
  else finishSession();
});
$("btn-quiz-back").addEventListener("click", () => { play("click"); renderHome(); show("screen-home"); });

function finishSession() {
  const { t } = curQ();
  if (session.mode === "text") {
    const prev = stats.texts[t.id] || { best: 0, done: false };
    stats.texts[t.id] = { best: Math.max(prev.best, session.selfCorrect), done: true };
    stats.totalSelf += session.selfCorrect;
    stats.totalDone += 1;
    saveJSON(KEY.stats, stats);
    const total = session.queue.length;
    $("result-face").src = session.selfCorrect === total ? FACE.celeb : FACE.happy;
    $("result-stars").textContent = "★".repeat(session.selfCorrect) + "☆".repeat(total - session.selfCorrect);
    $("result-title").textContent = session.selfCorrect === total ? "ぜんぶ 自力で 読めた！" : "おつかれさま！";
    $("result-msg").innerHTML = `「${R(t.title)}」のもんだい ${total}つのうち、答えも文も 自力で合っていたのは ${session.selfCorrect}つ。<br>まちがえた もんだいは「とっくん」で もう一度 たしかめられます。`;
    if (session.selfCorrect === total) { play("allclear"); confetti($("result-stars")); } else play("clear");
  } else {
    $("result-face").src = FACE.celeb;
    $("result-stars").textContent = "★";
    $("result-title").textContent = "とっくん 終わり！";
    $("result-msg").innerHTML = `自力で合っていた もんだいは、とっくんから 外れました。<br>残りの とっくんは ${mistakes.length}件です。`;
    play("clear");
  }
  show("screen-result");
}
$("btn-result-home").addEventListener("click", () => { play("click"); renderHome(); show("screen-home"); });

/* ================= とっくん ================= */
$("btn-train").addEventListener("click", () => {
  if (!mistakes.length) { setTrainEmpty(); return; }
  play("practice");
  const first = mistakes[0];
  if (first.qq === "__order__") { startOrder(first.textId, "train"); return; }
  const t = TEXTS.find(x => x.id === first.textId);
  const queue = mistakes.filter(m => m.textId === first.textId)
    .map(m => t.questions.findIndex(q => plain(q.q) === m.qq)).filter(i => i >= 0);
  startSession({ mode: "train", textId: first.textId, queue });
});
function setTrainEmpty() {
  $("result-face").src = FACE.happy;
  $("result-stars").textContent = "☆";
  $("result-title").textContent = "とっくんは ありません";
  $("result-msg").textContent = "まちがえた もんだいは、まだ ありません。文を 読んで、もんだいに ちょうせんしてみよう。";
  show("screen-result");
}

/* ================= 記録 ================= */
$("btn-records").addEventListener("click", () => {
  play("click");
  let rows = TEXTS.map(t => {
    const st = stats.texts[t.id] || { best: 0, done: false };
    return `<tr><td>${t.grade}年</td><td>${R(t.title)}</td><td>${st.done ? `自力でできた： ${st.best} / 4` : "まだ 読んでいない"}</td></tr>`;
  }).join("");
  $("records-body").innerHTML = `<table class="rec-table"><tr><th>学年</th><th>文</th><th>きろく</th></tr>${rows}</table>
    <p style="font-weight:700;">とっくんに 残っている もんだい： ${mistakes.length}件</p>`;
  show("screen-records");
});
$("btn-records-back").addEventListener("click", () => { play("click"); renderHome(); show("screen-home"); });

/* ================= じゅんばん ならべ ================= */
let orderSession = null;
function startOrder(textId, mode) {
  const t = TEXTS.find(x => x.id === textId);
  if (!t || !t.order) return;
  orderSession = { textId, mode, expect: t.order.slice(), pos: 0, stumbled: false };
  $("order-title").innerHTML = R(t.title);
  $("order-face").src = FACE.normal;
  $("order-msg").textContent = "物語の はじめから、順番に 文を タップしてね。";
  const row = $("order-cards");
  row.innerHTML = "";
  shuffle(t.order.slice()).forEach(idx => {
    const c = document.createElement("button");
    c.className = "order-card";
    c.innerHTML = R(t.sentences[idx]);
    c.addEventListener("click", () => tapOrderCard(c, idx));
    row.appendChild(c);
  });
  const scr = $("screen-order");
  scr.className = "screen " + (t.grade === 1 ? "g1" : "g2");
  show("screen-order");
}
function tapOrderCard(card, idx) {
  if (!orderSession || card.disabled) return;
  if (idx === orderSession.expect[orderSession.pos]) {
    play("correct");
    orderSession.pos++;
    const n = document.createElement("span");
    n.className = "order-num";
    n.textContent = orderSession.pos;
    card.appendChild(n);
    card.classList.add("done");
    card.disabled = true;
    if (orderSession.pos === orderSession.expect.length) finishOrder();
    else $("order-msg").textContent = "いいよ、その調子。つぎの文は どれかな？";
  } else {
    play("softFail");
    orderSession.stumbled = true;
    card.classList.add("shake");
    setTimeout(() => card.classList.remove("shake"), 320);
    $("order-msg").textContent = "うーん、その文は まだ先みたい。物語の流れを 思いうかべてみよう。";
  }
}
function finishOrder() {
  const t = TEXTS.find(x => x.id === orderSession.textId);
  const key = orderSession.textId + "|__order__";
  if (!orderSession.stumbled) {
    if (orderSession.mode === "train") {
      mistakes = mistakes.filter(m => (m.textId + "|" + m.qq) !== key);
      saveJSON(KEY.mistakes, mistakes);
    }
    play("allclear");
  } else {
    if (orderSession.mode === "text" && !mistakes.some(m => (m.textId + "|" + m.qq) === key)) {
      mistakes.push({ textId: orderSession.textId, qq: "__order__" });
      saveJSON(KEY.mistakes, mistakes);
    }
    play("clear");
  }
  $("result-face").src = FACE.celeb;
  $("result-stars").textContent = orderSession.stumbled ? "☆" : "★";
  $("result-title").textContent = "じゅんばん ばっちり！";
  $("result-msg").innerHTML = orderSession.stumbled
    ? `「${R(t.title)}」の順番は 分かったね。この ならべかえは「とっくん」に 入れたよ。あとで もう一度 たしかめられます。`
    : `「${R(t.title)}」の物語の順番を、全部 自力で 並べられました。`;
  show("screen-result");
  confetti($("result-stars"));
}
$("btn-order-back").addEventListener("click", () => { play("click"); orderSession = null; renderHome(); show("screen-home"); });

/* ================= 設定 ================= */
function applySettings() {
  $("btn-sound").textContent = "音：" + (settings.sound ? "ON" : "OFF");
  $("btn-sound").classList.toggle("on", settings.sound);
  $("btn-furigana").textContent = "ふりがな：" + (settings.furigana ? "ON" : "OFF");
  $("btn-furigana").classList.toggle("on", settings.furigana);
  document.body.classList.toggle("furigana-off", !settings.furigana);
}
$("btn-sound").addEventListener("click", () => { settings.sound = !settings.sound; saveJSON(KEY.settings, settings); applySettings(); play("click"); });
$("btn-furigana").addEventListener("click", () => {
  settings.furigana = !settings.furigana; saveJSON(KEY.settings, settings); applySettings();
  renderHome();
});
fetch("texts.json").then(r => { if (!r.ok) throw new Error("texts"); return r.json(); })
  .then(data => { TEXTS = data; migrateMistakes(); applySettings(); renderHome(); })
  .catch(() => {
    applySettings();
    $("text-grid").innerHTML = "<p style='font-weight:800;font-size:18px;'>文章データを 読み込めませんでした。通信のよいところで、もう一度 開いてください。</p>";
  });
</script>
</body>
</html>
